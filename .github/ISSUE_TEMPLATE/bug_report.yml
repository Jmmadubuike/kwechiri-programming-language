name: Bug report
description: Report a reproducible compiler, runtime, CLI, website, or extension defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Kwechiri. Please provide a minimal,
        reproducible example and avoid including secrets or personal data.

        For a security vulnerability, follow SECURITY.md instead of opening a
        public issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest sequence of commands or source needed to reproduce the problem.
      placeholder: |
        1. Create the source below.
        2. Run `kwechiri check example.kwe`.
        3. Observe the diagnostic.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Minimal Kwechiri source or command
      description: Use a minimal example. Remove private data and credentials.
      placeholder: |
        bipụta("Ndewo Ụwa!")
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include the complete diagnostic or error text.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kwechiri version
      description: Run `kwechiri --version`.
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and any relevant editor or browser version.
      placeholder: "Windows 11, Node.js 22.23.4, VS Code 1.100.0"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or additional context
      description: Stack traces, related issues, regression information, or anything else that helps.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets, credentials, and personal data from this report.
          required: true
