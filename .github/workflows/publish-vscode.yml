name: Publish VS Code extension

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and publish extension
    if: github.repository == 'Jmmadubuike/kwechiri-programming-language' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/vscode/package-lock.json

      - name: Install compiler dependencies
        run: npm ci

      - name: Install VS Code extension dependencies
        run: npm ci --prefix extensions/vscode

      - name: Audit compiler dependencies
        run: npm audit --audit-level=high

      - name: Audit extension dependencies
        run: npm --prefix extensions/vscode audit --audit-level=high

      - name: Run canonical compiler gate
        run: npm run check

      - name: Validate and package extension
        run: npm run vscode:check

      - name: Cache VS Code extension test runtime
        uses: actions/cache@v4
        with:
          path: extensions/vscode/.vscode-test
          key: ${{ runner.os }}-vscode-1.100.0

      - name: Test extension host
        run: xvfb-run -a npm run vscode:test

      - name: Publish with Marketplace trusted publishing
        run: >-
          npx --yes @vscode/vsce@4.1.0 publish
          --oidc
          --packagePath extensions/vscode/kwechiri-language-0.1.3.vsix
