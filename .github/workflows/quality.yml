name: Kwechiri CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit compiler dependencies
        run: npm audit --audit-level=high

      - name: Run canonical quality gate
        run: npm run check

      - name: Install website dependencies
        if: matrix.node-version == 24
        run: npm ci --prefix website

      - name: Validate website
        if: matrix.node-version == 24
        run: npm run website:check

      - name: Audit website dependencies
        if: matrix.node-version == 24
        run: npm --prefix website audit --audit-level=high

      - name: Install Playwright Chromium
        if: matrix.node-version == 24
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Test playground in Chromium
        if: matrix.node-version == 24
        run: npm run website:e2e

      - name: Smoke-test existing CLI
        run: node dist/cli/index.js hello.kwe
